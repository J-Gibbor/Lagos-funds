<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LagosLife | Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="#">LAGOS<span>LIFE</span></a><span class="navbar-text">Your city. Your story.</span></div></nav>
  <main class="container py-5">
    <div class="row justify-content-center align-items-center g-4">
      <div class="col-lg-5 d-none d-lg-block">
        <div class="hero-panel p-4 p-xl-5"><span class="eyebrow">WELCOME TO THE CITY</span><h1 class="display-4 fw-bold mt-3">Your Lagos story starts here.</h1><p class="text-white-50">Create an account or sign in to continue.</p><div class="city-line">LAGOS · NIGERIA</div></div>
      </div>
      <div class="col-md-8 col-lg-5">
        <section class="auth-card p-4 p-md-5">
          <div class="text-center mb-4"><div class="brand-mark">LL</div><h2 class="fw-bold mt-3" id="formTitle">Welcome back</h2><p class="text-secondary" id="formSubtitle">Sign in to your LagosLife account</p></div>
          <div id="alertBox" class="alert d-none" role="alert"></div>
          <form id="loginForm">
            <div class="mb-3"><label class="form-label" for="loginEmail">Email address</label><input class="form-control" id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div>
            <div class="mb-3"><label class="form-label" for="loginPassword">Password</label><input class="form-control" id="loginPassword" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters"></div>
            <button class="btn btn-primary w-100 py-2" type="submit" id="loginButton">Sign in</button>
          </form>
          <form id="registerForm" class="d-none">
            <div class="mb-3"><label class="form-label" for="fullName">Full name</label><input class="form-control" id="fullName" required maxlength="80" autocomplete="name" placeholder="Your name"></div>
            <div class="mb-3"><label class="form-label" for="registerEmail">Email address</label><input class="form-control" id="registerEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div>
            <div class="mb-3"><label class="form-label" for="registerPassword">Password</label><input class="form-control" id="registerPassword" type="password" required  autocomplete="new-password" placeholder="Enter password"></div>
            <button class="btn btn-primary w-100 py-2" type="submit" id="registerButton">Create account</button>
          </form>
          <div class="d-flex justify-content-between mt-3 small"><button class="link-button" id="switchMode" type="button">Create an account</button><button class="link-button" id="forgotButton" type="button">Forgot password?</button></div>
          <p class="small text-secondary text-center mt-4 mb-0">By continuing, you agree to our terms and privacy policy.</p>
        </section>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script>
</body></html>
